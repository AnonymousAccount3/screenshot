[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshot"
version = "0.1.0"
description = "ScreenShot: A Foundation Model for Few-Shot Combination Drug Screening"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "tqdm>=4.60.0",
    "scikit-learn>=1.0.0",
    "pyarrow>=10.0.0",
    "networkx>=2.6.0",
    "rdkit>=2022.3.0",
    "requests>=2.28.0",
    "requests-cache>=0.9.0",
    "pyyaml>=6.0",
    "xgboost>=1.7.0",
    "tabpfn>=0.1.0",
    "onebatch>=0.1.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["screenshot*", "datascreen*"]
